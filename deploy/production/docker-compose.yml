name: s3-center

services:
  app:
    image: "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/${IMAGE_NAME:-s3-center}:${IMAGE_TAG:-latest}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    command: ["-config", "/etc/s3-center/config.yaml", "-mode", "all"]
    volumes:
      - ./config.yaml:/etc/s3-center/config.yaml:ro
    ports:
      - "127.0.0.1:48080:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: s3_center
      POSTGRES_USER: s3_center
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3_center -d s3_center"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CF_TUNNEL_TOKEN}"]
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
