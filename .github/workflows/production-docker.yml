name: Production Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-s3-center
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: s3-center
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  test-build-deploy:
    if: ${{ (vars.REGISTRY_TARGET || 'ghcr') == 'ghcr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=sha-${{ github.sha }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync deployment definition
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            deploy/production/docker-compose.yml \
            deploy/production/config.yaml \
            deploy/production/.env.example \
            deploy/production/README.md \
            deploy/production/EXTERNAL-S3.md \
            deploy/production/R2-ACCOUNT-MANAGEMENT.md \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Ensure managed-backend encryption key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; cd '$DEPLOY_PATH'; test -f .env; \
             if ! grep -q '^DYNAMIC_BACKEND_MASTER_KEY=' .env; then \
               umask 077; key=\$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n'); \
               printf '\nDYNAMIC_BACKEND_MASTER_KEY=%s\n' \"\$key\" >> .env; \
             fi; \
             length=\$(awk -F= '/^DYNAMIC_BACKEND_MASTER_KEY=/{print length(substr(\$0,index(\$0,\"=\")+1)); found=1} END{if (!found) exit 1}' .env); \
             test \"\$length\" -ge 32; echo 'managed-backend encryption key is ready'"

      - name: Deploy and verify
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin && \
             IMAGE_REGISTRY='$IMAGE_REGISTRY' IMAGE_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' docker compose pull '$DEPLOY_SERVICE' && \
             IMAGE_REGISTRY='$IMAGE_REGISTRY' IMAGE_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' docker compose up -d && \
             for i in \$(seq 1 30); do curl -fsS http://127.0.0.1:48080/health/ready && exit 0; sleep 2; done; \
             docker compose ps; docker compose logs --tail=120 '$DEPLOY_SERVICE'; exit 1"

      - name: Configure Cloudflare Tunnel routes
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CF_API_TOKEN"

          tunnel_id="$(curl -fsS "$api/accounts/$CF_ACCOUNT_ID/cfd_tunnel?name=s3-center-production&is_deleted=false" \
            -H "$auth" | jq -er '.result[0].id')"

          jq -n '{config:{ingress:[
            {hostname:"s3-center.aiid.qzz.io",service:"http://app:9000"},
            {hostname:"s3-api.aiid.qzz.io",service:"http://app:9000"},
            {service:"http_status:404"}
          ]}}' | curl -fsS "$api/accounts/$CF_ACCOUNT_ID/cfd_tunnel/$tunnel_id/configurations" \
            -X PUT -H "$auth" -H 'Content-Type: application/json' --data-binary @- \
            | jq -e '.success == true' >/dev/null

          zone_id="$(curl -fsS "$api/zones?name=aiid.qzz.io" -H "$auth" | jq -er '.result[0].id')"
          for hostname in s3-center.aiid.qzz.io s3-api.aiid.qzz.io; do
            record_id="$(curl -fsS "$api/zones/$zone_id/dns_records?type=CNAME&name=$hostname" \
              -H "$auth" | jq -r '.result[0].id // empty')"
            payload="$(jq -n --arg name "$hostname" --arg content "$tunnel_id.cfargotunnel.com" \
              '{type:"CNAME",name:$name,content:$content,proxied:true,ttl:1}')"
            if [[ -n "$record_id" ]]; then
              curl -fsS "$api/zones/$zone_id/dns_records/$record_id" -X PATCH \
                -H "$auth" -H 'Content-Type: application/json' --data "$payload" \
                | jq -e '.success == true' >/dev/null
            else
              curl -fsS "$api/zones/$zone_id/dns_records" -X POST \
                -H "$auth" -H 'Content-Type: application/json' --data "$payload" \
                | jq -e '.success == true' >/dev/null
            fi
          done

      - name: Verify public endpoint
        shell: bash
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://s3-api.aiid.qzz.io/health/ready && exit 0
            sleep 2
          done
          exit 1
